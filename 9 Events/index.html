<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Event Handling</h1>
    <!-- Inline Event Handling (Not recommended) -->
    <button onclick="console.log('Button was clicked'); alert('Hello');">Click me!</button>
    <button id="butt" ondblclick = "console.log('This is through HTML');">Click me 2 times!</button>

    <div onmouseover="console.log('You are inside div!');">
        This is a div
    </div>

    <!-- JS node.element = () => {}; -->
    <button id="btn1">Btn1</button>
    <div id="box1">
        This is second div
    </div>

    <button id="btn2">Btn2</button><br>

    <button id="btn3">Btn3</button><br>

    <!-- JS EventListners -->
     <button id="btn4">Btn4</button><br>

     <button id="btn5">Btn5</button>
    <script src="script.js"></script>
</body>
</html>
