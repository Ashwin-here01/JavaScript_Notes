<!DOCTYPE html>

    <title>DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="heading">DOM (Document Object Model)</h1>

        <ul>
            <li>Apple</li>
            <li>Mango</li>
            <li>Litchi</li>
